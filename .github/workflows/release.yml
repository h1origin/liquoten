name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 测试
        run: go test ./... && go vet ./... && test -z "$(gofmt -l .)"

      - name: 确定版本号
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: 打包 dmg
        run: ./app/package-dmg.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: liquoten-${{ env.VERSION }}
          path: |
            build/liquoten-${{ env.VERSION }}.dmg
            build/liquoten-${{ env.VERSION }}.dmg.sha256
          retention-days: 7

      - name: 发布
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" "build/liquoten-${VERSION}.dmg" "build/liquoten-${VERSION}.dmg.sha256" \
            --title "liquoten ${VERSION}" --notes-file notes.md
