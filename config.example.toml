# liquoten 示例配置。复制到 ~/.config/liquoten/config.toml 后按需修改。
#
# 说明：
#   - 出现在 [providers.xxx] 里的 provider 默认启用，除非显式 enabled = false
#   - api_key 留空时：百炼走环境变量 DASHSCOPE_API_KEY 或 `bl auth login` 的登录态
#   - thresholds 按 provider -> section 名配置，升穿阈值发一次 macOS 通知

poll_interval = "10m"

[providers.bailian]
enabled = true
# api_key = "sk-你的key"
# command = "bl"        # bailian-cli 可执行文件路径（默认 PATH 里的 bl）
# timeout = "45s"       # 单次查询超时

[thresholds.bailian]
"5-hour quota" = 80.0
"1-week quota" = 90.0
