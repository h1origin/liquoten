# liquoten 示例配置。复制到 ~/.config/liquoten/config.toml 后按需修改。
#
# 说明：
#   - 默认不启用任何 provider；出现在 [providers.xxx] 里的即启用，除非显式 enabled = false
#   - 也可以在 Liquoten 面板的“服务”页开关，App 会改写本文件对应的 enabled 行
#   - 百炼用量查询依赖 `bl auth login --console` 的控制台登录态（或在菜单里点"登录百炼"）；
#     api_key 只会以 DASHSCOPE_API_KEY 传给 bl，查不到 Token Plan 用量
#   - alert_remaining：每项额度剩余降到这些百分比时各提醒一次（默认 50% 和 20%），[] 关闭
#   - thresholds 按 provider -> section 名配置已用百分比，作为额外提醒点（可选）
#   - notify = "app"（默认）把告警事件写入缓存目录，由 Liquoten.app 投递系统通知；
#     notify = "osascript" 则由 daemon 直接用 macOS 通知（无 App 时的回退方案）

poll_interval = "1m"
# alert_remaining = [50.0, 20.0]
# notify = "app"

[providers.bailian]
enabled = true
# api_key = "sk-你的key"
# command = "bl"        # bailian-cli 可执行文件路径（默认 PATH 里的 bl）
# timeout = "45s"       # 单次查询超时

# [thresholds.bailian]
# "1-month quota" = 90.0   # 已用 90% 时额外提醒一次

# Claude Code 订阅（Pro/Max）5 小时 / 7 天用量。数据由 Claude Code 的 statusLine
# 命令 `liquoten statusline` 落盘到缓存目录，配置方法见 README。
# [providers.claudecode]
#
# [thresholds.claudecode]
# "5-hour quota" = 80.0
# "1-week quota" = 90.0

# ChatGPT Codex 订阅：读取 ~/.codex/sessions 里的用量记录（设 CODEX_HOME 可改目录），只在使用 Codex 时更新。
# [providers.codex]
#
# [thresholds.codex]
# "5-hour quota" = 80.0
# "1-week quota" = 90.0

# Qoder（qoder）/ Qoder CN（qodercn）：用个人访问令牌查询本计费周期 Credits。
# 在 App“服务”页打开开关时弹窗填写并验证，关闭时从本文件删除 api_key。
# [providers.qodercn]
# api_key = "在 qoder.com.cn/account/integrations 生成的令牌"
#
# [thresholds.qodercn]
# "1-month quota" = 90.0
