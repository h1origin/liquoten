# liquoten 示例配置。复制到 ~/.config/liquoten/config.toml 后按需修改。
#
# 说明：
#   - 出现在 [providers.xxx] 里的 provider 默认启用，除非显式 enabled = false
#   - 百炼用量查询依赖 `bl auth login --console` 的控制台登录态（或在菜单里点"登录百炼"）；
#     api_key 只会以 DASHSCOPE_API_KEY 传给 bl，查不到 Token Plan 用量
#   - thresholds 按 provider -> section 名配置，升穿阈值发一次通知
#   - notify = "app"（默认）把告警事件写入缓存目录，由 Liquoten.app 投递系统通知；
#     notify = "osascript" 则由 daemon 直接用 macOS 通知（无 App 时的回退方案）

poll_interval = "15m"
# notify = "app"

[providers.bailian]
enabled = true
# api_key = "sk-你的key"
# command = "bl"        # bailian-cli 可执行文件路径（默认 PATH 里的 bl）
# timeout = "45s"       # 单次查询超时

[thresholds.bailian]
"5-hour quota" = 80.0
"1-week quota" = 90.0

# Claude Code 订阅（Pro/Max）5 小时 / 7 天用量。数据由 Claude Code 的 statusLine
# 命令 `liquoten statusline` 落盘到缓存目录，配置方法见 README。
# [providers.claudecode]
#
# [thresholds.claudecode]
# "5-hour quota" = 80.0
# "1-week quota" = 90.0
